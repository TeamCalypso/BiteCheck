name: backend-tests

on:
  push:
    paths:
      - "services/api/**"
      - "contract/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "contract/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
